[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chezz"
version = "0.1.0"
description = "Offline chess review and training app built from your own games"
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "chess>=1.10",
  "pywebview>=5.0",
  "zstandard>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["chezz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
